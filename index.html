<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحتي الأولى</title>

    <style>
        body {
            background-color: #f0f4f8;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        .card {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #ccc;
        }

        h1 {
            color: #0077b6;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            background-color: #0077b6;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #023e8a;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>أهلاً وسهلاً 👋</h1>
        <p>هاي أول صفحة ويب إلي!</p>
        <p>أتعلم HTML و CSS خطوة بخطوة 🚀</p>

        <button onclick="alert('هلا بيك حبيبي ❤️')">
            اضغط هنا
        </button>
    </div>

</body>
</html>
